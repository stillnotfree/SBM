<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101419"/>
      <stop offset="1" stop-color="#202a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#557389" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#101419" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="112" y="120" width="400" height="400" rx="96"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="120" width="400" height="400" rx="96" fill="#151b21" stroke="#64727d" stroke-width="2"/>
    <image href="../Resources/AppIcon.icon/Assets/sing-box.png"
           x="132" y="140" width="360" height="360"
           preserveAspectRatio="xMidYMid meet" clip-path="url(#iconClip)"/>
  </g>

  <text x="598" y="282" fill="#f4f6f8"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="112" font-weight="700" letter-spacing="-3">SBM</text>
  <text x="602" y="350" fill="#c3ccd3"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="35" font-weight="500">Native sing-box client for macOS</text>
  <text x="602" y="405" fill="#82909a"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="25">TUN only · Apple Silicon · No telemetry</text>
</svg>
